services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: medplum
      POSTGRES_DB: medplum
    volumes:
      - medplum-postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - statement_timeout=60000
      - -c
      - default_transaction_isolation=REPEATABLE READ
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass medplum
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "medplum", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  binary-storage-init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/medplum/binary && chown -R 1000:1000 /var/lib/medplum/binary"]
    volumes:
      - medplum-binary-data:/var/lib/medplum/binary

  medplum-server:
    image: medplum/medplum-server:5.1.27
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      binary-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8103:8103"
    command: ["env"]
    environment:
      MEDPLUM_PORT: 8103
      MEDPLUM_BASE_URL: http://localhost:8103/
      MEDPLUM_APP_BASE_URL: http://localhost:3002/
      MEDPLUM_STORAGE_BASE_URL: http://localhost:8103/storage/
      MEDPLUM_DATABASE_HOST: postgres
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: medplum
      MEDPLUM_DATABASE_USERNAME: medplum
      MEDPLUM_DATABASE_PASSWORD: medplum
      MEDPLUM_REDIS_HOST: redis
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_REDIS_PASSWORD: medplum
      MEDPLUM_BINARY_STORAGE: file:/var/lib/medplum/binary
      MEDPLUM_SUPPORT_EMAIL: '"Medplum" <support@medplum.local>'
      MEDPLUM_ALLOWED_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
      # Consultation transactions can contain the bounded 35 MB base64 audio payload.
      MEDPLUM_MAX_JSON_SIZE: 40mb
      MEDPLUM_MAX_BATCH_SIZE: 50mb
      MEDPLUM_VM_CONTEXT_BOTS_ENABLED: "true"
      MEDPLUM_DEFAULT_BOT_RUNTIME_VERSION: vmcontext
      MEDPLUM_INTROSPECTION_ENABLED: "true"
      MEDPLUM_SHUTDOWN_TIMEOUT_MILLISECONDS: 30000
    volumes:
      - medplum-binary-data:/var/lib/medplum/binary
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://localhost:8103/healthcheck").then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))'
      interval: 20s
      timeout: 10s
      retries: 10

  medplum-app:
    image: medplum/medplum-app:5.1.27
    restart: unless-stopped
    depends_on:
      medplum-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  medplum-postgres-data:
  medplum-binary-data:
